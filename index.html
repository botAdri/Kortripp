<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 · Guide de Voyage — Automne</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#B84A22">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한국 Voyage">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

<!-- Polices Google -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+KR:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Lien vers le fichier CSS externe -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="jsErrorBanner" style="display:none; position:fixed; z-index:99999; top:0; left:0; right:0; background:#B84A22; color:#fff; font:12px/1.5 monospace; padding:10px 14px; white-space:pre-wrap;"></div>

<div class="app">
  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <div>
      <span class="header-korean">한국 로드트립 · 활동 가이드</span>
      <h1 class="header-title">Guide de <span class="season-title-active">Voyage</span></h1>
    </div>
    <span class="header-sub" id="headerSub">🍂 Dates à définir · Route de l'Ouest · 8 étapes</span>

    <div class="season-toggle" id="seasonToggle" data-season="automne">
      <div class="season-toggle-pill"></div>
      <button class="season-btn" data-value="automne">🍂 Automne</button>
      <button class="season-btn" data-value="printemps">🌸 Printemps</button>
    </div>

    <div class="header-right">
      <button class="action-pill" id="currencyToggleBtn" title="Basculer € / ₩ (hôtels, activités, location — hors vols)">💱 €</button>
      <button class="action-pill" id="icsExportBtn" title="Exporter les dates de l'itinéraire au format calendrier">📅 .ics</button>
      <button class="action-pill" id="shareBtn" title="Partager cette page">🔗 Partager</button>
      <button class="action-pill" id="kakaoSeasonBtn" title="Ouvre la carte saisonnière de Kakao Map">🍁 Feuillages</button>
      <span class="stat-pills-group">
        <span class="stat-pill">🗺️ 8 villes</span>
        <span class="stat-pill" id="statActs">🎯 28 activités</span>
        <span class="stat-pill">📅 14 jours</span>
      </span>
    </div>
  </header>

  <!-- ═══ BODY ═══ -->
  <div class="body">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <!-- City tabs -->
      <div class="city-tabs" id="cityTabs"></div>
      <!-- Panels -->
      <div class="activities-panel" id="activitiesPanel"></div>
    </aside>

    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-filters" id="mapFilters"></div>
      <button class="budget-fab" id="budgetFab">💰 Budget du voyage</button>
      <div class="map-legend">
        <div class="map-legend-title" id="legendTitle">🍂 Étapes automne</div>
        <div id="legendRows"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ ENCART BUDGET ═══ -->
<div class="budget-overlay" id="budgetOverlay">
  <div class="budget-modal" id="budgetModal">
    <button class="budget-modal-close" id="budgetClose">✕</button>
    <div id="budgetModalBody"></div>
  </div>
</div>

<!-- ═══ VUE RUE (Kakao Roadview) ═══ -->
<div class="rv-overlay" id="rvOverlay">
  <div class="rv-modal">
    <button class="rv-close" id="rvClose" aria-label="Fermer">✕</button>
    <div class="rv-head">
      <div class="rv-title" id="rvTitle"></div>
      <div class="rv-place" id="rvPlace"></div>
    </div>
    <div class="rv-view" id="rvView"></div>
    <div class="rv-status" id="rvStatus"></div>
    <div class="rv-links" id="rvLinks"></div>
  </div>
</div>

<!-- Lien vers le fichier JS externe -->
<script src="script.js"></script>

<script>
  // Gestionnaire d'erreur simple pour le débogage
  window.addEventListener('error', function (e) {
    var el = document.getElementById('jsErrorBanner');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = '⚠️ Erreur JS : ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
  });
</script>
</body>
</html>
